name: capstone-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Remove previously recorded evidence from this CI workspace
        run: python -c "from pathlib import Path; import shutil; p=Path('docs/evidence/unit5'); shutil.rmtree(p); p.mkdir(parents=True)"
      - name: Download pinned public embedding model
        run: python -m tools.download_model
      - name: Run module and real-model tests with coverage
        run: python -m tools.capture_evidence
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit5-evidence
          path: docs/evidence/unit5/
