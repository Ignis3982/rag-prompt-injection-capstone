name: unit4-prototype-ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run smoke demo
        run: python -m src.rag_guard.demo "How do I reset a router safely?"
      - name: Run insufficient context demo
        run: python -m src.rag_guard.demo "How do I reset a router safely?" --data config/attack_only.json
